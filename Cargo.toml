[package]
name = "setu"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A local-first, controlled bridge between Joplin and AI assistants"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
url = "2.5"

[dev-dependencies]
serde_json = "1.0"
wiremock = "0.6"
